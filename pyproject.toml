[project]
name = "aml"
version = "0.1.0"
description = "Leak-free AML transaction monitoring: classical ML, statistical evaluation, MLflow, FastAPI + Streamlit"
authors = [
    { name = "krishna", email = "shuklakrishnamohan14@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "numpy>=2.5.5",
    "optuna>=5.1.0",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.54.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.67.0",
    "tabulate>=0.10.0",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]
