# Experiment settings. Every run reads this file and logs it to MLflow.

seed: 42

split:                       # time-based, by fraction of days
  train: 0.60
  val: 0.20
  test: 0.20

sampling:                    # case-control sampling for laptop-sized training data
  negative_rate: 0.08        # keep 8% of normal transactions, all laundering ones

alert_budgets: [0.005, 0.01, 0.02]   # fraction of transactions investigators can review

# Features never used by any model.
#  weekday: data covers only ~10 days, so weekday ≈ "which date" -> a time artefact, not behaviour.
excluded_features: [weekday]

compute:                     # laptop safety
  n_jobs: 2

optuna:
  n_trials_per_batch: 10
  timeout_seconds: 300
  storage: "sqlite:///optuna.db"   # studies persist, so short batches add up

# Domain constraints: more counterparties / faster activity must never LOWER risk,
# and a longer history between the same two accounts must never RAISE it.
monotone_constraints:
  s_out_cnt_1h: 1
  s_out_cnt_24h: 1
  s_out_uniq_24h: 1
  s_out_uniq_7d: 1
  r_in_uniq_24h: 1
  r_in_uniq_7d: 1
  pair_prev_cnt: -1

# Keep the constrained model unless it costs more than this (relative PR-AUC on validation).
max_constraint_cost: 0.03

bootstrap:
  n_resamples: 1000
  ci: 0.95

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "aml-transaction-monitoring"
  registered_model_name: "aml-lgbm"
